name: CI
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron:  '0 5 * * FRI'

concurrency:
  group: ${ {github.event_name }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{github.event_name == 'pull_request'}}

jobs:
  CI:
    # Ubuntu devel, Fedora Rawhide and some other in the matrix are allowed to fail, so continue with other builds
    continue-on-error: ${{ matrix.distro == 'ubuntu:devel' || matrix.distro == 'opensuse:latest' || matrix.distro == 'fedora:rawhide' || matrix.distro == 'ubuntu:intel' || matrix.continue-on-error == true }}
    strategy:
      matrix:
        distro: ['fedora:latest', 'fedora:rawhide', 'opensuse:latest', 'ubuntu:latest', 'ubuntu:devel', 'ubuntu:rolling', 'ubuntu:intel']
        toolchain: [gnu, clang]
        cmake_build_type: [Release, Debug]
        minimal: [false]
        coverage: [false]
        deploy: [false]
        include:
          - distro: 'fedora:latest'
            toolchain: gnu
            cmake_build_type: Release
            minimal: false
            coverage: false
            # make sure there is only one build deploying
            deploy: true
          - distro: 'fedora:latest'
            toolchain: gnu
            cmake_build_type: Release
            minimal: true
            coverage: false
            deploy: false
          - distro: 'fedora:latest'
            toolchain: clang
            cmake_build_type: Release
            minimal: true
            coverage: false
            deploy: false
          - distro: 'ubuntu:intel'
            toolchain: intel-oneapi
            cmake_build_type: Release
          - distro: 'ubuntu:intel'
            toolchain: intel-oneapi
            cmake_build_type: Debug
          #- distro: 'fedora:gmx9999'
          #  toolchain: gnu
          #  cmake_build_type: Release
          #  continue-on-error: true
          #- distro: 'fedora:gmx9999'
          #  toolchain: clang
          #  cmake_build_type: Release
          #  continue-on-error: true
          #- distro: 'fedora:gmx9999_d'
          #  toolchain: gnu
          #  cmake_build_type: Release
          #  continue-on-error: true
          #- distro: 'fedora:gmx9999_d'
          #  toolchain: clang
          #  cmake_build_type: Release
          #  continue-on-error: true
          - distro: 'fedora:latest'
            toolchain: gnu
            cmake_build_type: Debug
            minimal: false
            coverage: true
            deploy: false
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/votca/buildenv/${{ matrix.distro }}
      # https://bugzilla.redhat.com/show_bug.cgi?id=1900021
      options: --security-opt seccomp=unconfined
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Runner info
        # GitHub runners differ between runs (CPU model, vendor); this makes
        # timings comparable and shows whether MKL runs on an AMD CPU.
        run: |
          echo "nproc: $(nproc)"
          grep -m1 "model name" /proc/cpuinfo || true
          grep -c ^processor /proc/cpuinfo || true
          if command -v lscpu >/dev/null; then lscpu | grep -E "^CPU\(s\)|Thread\(s\) per core|Core\(s\) per socket|L3" || true; fi
      - name: Run Votca Setup
        id: setup #use this id below to use outputs
        uses: ./.github/actions/setup
        with:
          distro: ${{ matrix.distro }}
          toolchain: ${{ matrix.toolchain }}
          minimal: ${{ matrix.minimal == true }}
          coverage: ${{ matrix.coverage }}
          cmake_build_type: ${{ matrix.cmake_build_type }}
          ctest_args: ${{ matrix.ctest_args }}
          cmake_args: ${{ matrix.cmake_args }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ steps.setup.outputs.cache_key }}
          restore-keys: ${{ steps.setup.outputs.cache_restore_key }}
      - name: CMake
        run: cmake -B builddir -S . ${{ steps.setup.outputs.cmake_args }}
      - name: Build
        run: |
          ccache -z
          cmake --build builddir -- -j ${{ steps.setup.outputs.jobs }}
          ccache -v -s
      - name: Tests (light, one thread each)
        # One test per core, each with one OpenMP thread: without the limit every
        # test would also start one thread per core and oversubscribe the runner.
        # Passive waiting stops idle OpenMP threads from spinning.
        env:
          OMP_NUM_THREADS: 1
          OMP_WAIT_POLICY: passive
        run: ctest --test-dir builddir -LE heavy --parallel $(nproc) --output-on-failure ${{ steps.setup.outputs.ctest_args }}
      - name: Tests (heavy, one after another with all cores)
        # also run when a light test failed, so one CI run reports both batches
        if: ${{ !cancelled() }}
        # Tests labelled "heavy" in CMake (xtp/src/tests/CMakeLists.txt); running
        # them threaded also tests the OpenMP code paths in Debug builds.
        env:
          OMP_WAIT_POLICY: passive
        # Coverage builds: all threads update the same coverage counters, so
        # threads slow the tests down instead of speeding them up (fedora gnu
        # coverage job hit the 6 h limit). There the heavy tests run like the
        # light ones, single-threaded and side by side.
        run: |
          if [ "${{ matrix.coverage }}" = "true" ]; then t=1; p=$(nproc); else t=$(nproc); p=1; fi
          OMP_NUM_THREADS=$t ctest --test-dir builddir -L heavy --parallel $p --output-on-failure ${{ steps.setup.outputs.ctest_args }}
      - name: Upload Report to codecov.io
        if: ${{ matrix.coverage }}
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Doxygen
        run: cmake --build builddir --target doxygen
      - name: Build Sphinx
        if: ${{ steps.setup.outputs.build_sphinx == 'true' }}
        run: cmake --build builddir --target sphinx
      - name: Test DESTDIR Install
        run: DESTDIR=${PWD}/install cmake --build builddir --target install && rm -rf ${PWD}/install/usr && rm -rf ${PWD}/install/github && rmdir ${PWD}/install
      - name: Install
        run: sudo LD_LIBRARY_PATH=$LD_LIBRARY_PATH cmake --build builddir --target install
      - name: Check for untracked files
        run: git status --porcelain && git status --porcelain | sed Q1
      - name: Check Formatting
        if: ${{ steps.setup.outputs.check_format == 'true' }}
        run: cmake --build builddir --target format && git diff --exit-code
      - name: Checkout Doxygen repo
        if: ${{ matrix.deploy }}
        uses: actions/checkout@v4
        with:
          repository: votca/doxygen
          path: builddir/devdoc
          token: ${{ secrets.VOTCA_BOT_TOKEN || github.token }}
      - name: Checkout Website repo
        if: ${{ matrix.deploy }}
        uses: actions/checkout@v4
        with:
          repository: votca/votca.github.io
          path: builddir/userdoc
          token: ${{ secrets.VOTCA_BOT_TOKEN || github.token }}
      - name: Deploy Doxygen and Website
        if: ${{ matrix.deploy && github.repository_owner == 'votca' && steps.setup.outputs.build_sphinx == 'true' }}
        run: ${GITHUB_WORKSPACE}/.github/workflows/deploy.sh
        working-directory: builddir
